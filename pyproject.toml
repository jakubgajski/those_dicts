[project]
name = "those-dicts"
version = "0.2.0"
description = "Those missing flavors of dict"
authors = [{ name = "Jakub Gajski", email = "jakub.gajski@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["graph", "batch", "two way", "dict", "dicts", "data structures", "lightweight"]
dependencies = []

[project.urls]
Repository = "https://github.com/jakubgajski/those_dicts"

[dependency-groups]
dev = [
    "pytest>=8.0.1",
    "pyrefly>=1.2.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["those_dicts"]

[tool.hatch.build.targets.sdist]
# hatchling would otherwise ship everything git does not ignore (CLAUDE.md, uv.lock,
# .pre-commit-config.yaml). Matches the shape Poetry published up to 0.1.1.
include = ["those_dicts", "README.md"]
exclude = [".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["those_dicts", "tests"]
python-version = "3.9"

[tool.pyrefly.errors]
# Every class here deliberately changes the signature or semantics it inherits from dict
# (keys/values/items are redefined graph-wise, update/pop follow the custom __setitem__).
# That divergence is the library, not a mistake, so the check is off project-wide.
bad-override = false
