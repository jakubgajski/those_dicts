repos:
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.2.0
    hooks:
      - id: pyrefly-check
        # pre-commit builds its own isolated env for this hook, so it must be told about
        # anything the checked code imports. Keep in sync with the dev group in pyproject.toml.
        additional_dependencies: ["pytest>=8.0.1"]
